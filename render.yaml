services:
  # 1. PayRoute API Web Service
  - type: web
    name: payroute-api
    runtime: docker
    dockerfilePath: docker/backend.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: payroute
      - key: REDIS_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PRIMARY_GATEWAY
        value: stripe
      - key: PAYMENT_MAX_RETRIES
        value: "2"
      - key: RETRY_INITIAL_DELAY_MS
        value: "1000"
      - key: GATEWAY_TIMEOUT_MS
        value: "8000"
      - key: CIRCUIT_BREAKER_THRESHOLD
        value: "5"

  # 2. PayRoute Background Worker Daemon (BullMQ)
  - type: worker
    name: payroute-worker
    runtime: docker
    dockerfilePath: docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromService:
          type: web
          name: payroute-api
          envVarKey: MONGODB_URI
      - key: MONGODB_DB
        value: payroute
      - key: REDIS_URL
        fromService:
          type: web
          name: payroute-api
          envVarKey: REDIS_URL
      - key: STRIPE_SECRET_KEY
        fromService:
          type: web
          name: payroute-api
          envVarKey: STRIPE_SECRET_KEY
      - key: STRIPE_WEBHOOK_SECRET
        fromService:
          type: web
          name: payroute-api
          envVarKey: STRIPE_WEBHOOK_SECRET
      - key: RAZORPAY_KEY_ID
        fromService:
          type: web
          name: payroute-api
          envVarKey: RAZORPAY_KEY_ID
      - key: RAZORPAY_KEY_SECRET
        fromService:
          type: web
          name: payroute-api
          envVarKey: RAZORPAY_KEY_SECRET
      - key: JWT_SECRET
        fromService:
          type: web
          name: payroute-api
          envVarKey: JWT_SECRET
      - key: PRIMARY_GATEWAY
        value: stripe
      - key: PAYMENT_MAX_RETRIES
        value: "2"
      - key: RETRY_INITIAL_DELAY_MS
        value: "1000"
      - key: GATEWAY_TIMEOUT_MS
        value: "8000"
      - key: CIRCUIT_BREAKER_THRESHOLD
        value: "5"

  # 3. PayRoute Operations Dashboard (Static Site)
  - type: web
    name: payroute-dashboard
    runtime: static
    buildCommand: npm ci && npm run build -w shared && npm run build -w frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: VITE_API_BASE_URL
        sync: false
